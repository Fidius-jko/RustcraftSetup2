[package]
name = "rustcraft"
version = "0.0.1" # TODO VERSION
publish = false
authors = ["Nikolay Grishaev <github/Fidius-jko>"]
edition = "2021"
exclude = ["dist", "build", "assets", "credits"]

[workspace]
members = ["mobile"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
features = ["dev"]

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = [
    "bevy/dynamic_linking",
]

# All of Bevy's default features exept for the audio related ones (bevy_audio, vorbis), since they clash with bevy_kira_audio
#   and android_shared_stdcxx, since that is covered in `mobile`
[dependencies]
bevy = { version = "0.14", default-features = false, features = [
    #"animation",
    "bevy_asset",
    "bevy_state",
    "bevy_color",
    "bevy_gilrs",
    "bevy_scene",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "multi_threaded",
    "png",
    "hdr",
    "x11",
    "bevy_gizmos",
    "tonemapping_luts",
    "smaa_luts",
    "default_font",
    "webgl2",
    "sysinfo_plugin",
] }

# keep the following in sync with Bevy's dependencies
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
# ----------------------------------------------------

#bevy_fluent = "0.9" TODO!
bevy_framepace = "0.17.0"
bevy-panic-handler = "3.0.0"
bevy-inspector-egui = "0.26.0"
iyes_progress = { version = "0.12", features=["assets"]}
serde = "1.0.197" 
bevy_rapier3d = "0.27.0"
leafwing-input-manager = {git="https://github.com/Leafwing-Studios/leafwing-input-manager.git", features = []}
primitive-types = "0.13"
thiserror = "1.0.63"




[build-dependencies]
embed-resource = "2.4.2"
